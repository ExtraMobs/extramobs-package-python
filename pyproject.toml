[build-system]
requires = ["setuptools >= 75.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "extramobs"
version = "0.0.2"
authors = [
  { name="ExtraMobs", email="extramobs@hotmail.com" },
]
description = "Library for general purposes"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/ExtraMobs/extramobs-package-python"
Repository = "https://gitlab.com/ExtraMobs/extramobs-package-python.git"